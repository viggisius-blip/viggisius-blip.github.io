name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ACEA50: ${{ secrets.ACEA50 }}
          BA2EB2: ${{ secrets.BA2EB2 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('ACEA50', '')
          meta_b = os.environ.get('BA2EB2', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 0b3147cab241b8a6e33de67185d7fe8d46e4 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- b6e929c35b60128267efdab4d6 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
